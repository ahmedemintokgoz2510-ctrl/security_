name: Android APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Verify Project Structure
        run: |
          echo "=== Root contents ==="
          ls -la
          echo "=== app/ contents ==="
          ls -la app/
          echo "=== gradle/wrapper/ contents ==="
          ls -la gradle/wrapper/
          
      - name: Build Debug APK (using wrapper jar directly)
        run: |
          java -jar gradle/wrapper/gradle-wrapper.jar :app:assembleDebug --no-daemon --stacktrace
          
      - name: Verify APK Output
        run: |
          ls -la app/build/outputs/apk/debug/
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
